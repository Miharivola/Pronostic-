<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bet261 Virtual Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0F172A; color: #F8FAFC; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="bg-[#1E293B] px-4 py-3 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-2">
            <span class="text-emerald-400 text-xl font-bold">⚽ VIRTUAL PRO 261</span>
        </div>
        <div class="flex items-center space-x-2">
            <!-- Fast Forward Test Button -->
            <button onclick="triggerNextRound()" title="Mandeha avy hatrany (Test)" class="bg-amber-500/20 text-amber-400 border border-amber-500 px-2 py-1 rounded text-xs font-bold hover:bg-amber-500/30">
                ⏩ Test
            </button>
            <!-- Timer Badge -->
            <div id="timer-badge" class="flex items-center space-x-1 bg-emerald-500/20 border border-emerald-500 px-3 py-1 rounded-full text-emerald-400 font-bold text-sm">
                <span>⏱️</span>
                <span id="timer-text">02:00</span>
            </div>
        </div>
    </header>

    <!-- LEAGUE SWITCHER -->
    <div class="p-3 grid grid-cols-2 gap-3 bg-[#0F172A]">
        <button onclick="switchLeague(0)" id="btn-league-0" class="p-3 rounded-xl font-bold text-center transition border border-emerald-500 bg-emerald-500 text-black">
            <div>English League</div>
            <div id="sub-league-0" class="text-xs font-semibold mt-1 opacity-80">J1 / 38</div>
        </button>
        <button onclick="switchLeague(1)" id="btn-league-1" class="p-3 rounded-xl font-bold text-center transition border border-white/10 bg-[#1E293B] text-white">
            <div>Coupe d'Afrique</div>
            <div id="sub-league-1" class="text-xs font-semibold mt-1 opacity-50">J1 / 46</div>
        </button>
    </div>

    <!-- CURRENT JOURNEE BANNER -->
    <div class="bg-[#1E293B] px-4 py-2 flex justify-between items-center border-y border-white/5 text-xs font-bold">
        <span id="active-league-name" class="text-white/70 uppercase tracking-wider">English League</span>
        <span id="journee-badge" class="bg-amber-500/20 text-amber-400 px-2.5 py-1 rounded">JOURNÉE 1 / 38</span>
    </div>

    <!-- TABS -->
    <div class="flex bg-[#1E293B] border-b border-white/10 text-xs font-bold">
        <button onclick="switchTab('pronostics')" id="tab-pronostics" class="flex-1 py-3 text-center text-emerald-400 border-b-2 border-emerald-400">PRONOSTICS</button>
        <button onclick="switchTab('resultats')" id="tab-resultats" class="flex-1 py-3 text-center text-white/60">RÉSULTATS</button>
        <button onclick="switchTab('classement')" id="tab-classement" class="flex-1 py-3 text-center text-white/60">CLASSEMENT</button>
    </div>

    <!-- CONTENT AREA -->
    <main class="flex-1 p-3 overflow-y-auto max-w-2xl mx-auto w-full">
        <div id="view-pronostics" class="space-y-3"></div>
        <div id="view-resultats" class="space-y-3 hidden"></div>
        <div id="view-classement" class="hidden overflow-x-auto"></div>
    </main>

    <script>
        // DATA & LOGIC
        const leagues = [
            {
                name: "English League",
                maxJournees: 38,
                currentJournee: 1,
                teams: [
                    { name: "Manchester City", strength: 10, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Arsenal", strength: 9, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Liverpool", strength: 9, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Chelsea", strength: 8, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Tottenham", strength: 8, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Newcastle", strength: 8, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Aston Villa", strength: 7, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Manchester United", strength: 7, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Brighton", strength: 7, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "West Ham", strength: 6, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Brentford", strength: 6, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Crystal Palace", strength: 6, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Fulham", strength: 6, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Wolverhampton", strength: 5, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Bournemouth", strength: 5, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Everton", strength: 5, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Nottingham Forest", strength: 5, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Leicester City", strength: 4, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Ipswich Town", strength: 4, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Southampton", strength: 4, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 }
                ],
                schedule: []
            },
            {
                name: "Coupe d'Afrique",
                maxJournees: 46,
                currentJournee: 1,
                teams: [
                    { name: "Maroc", strength: 10, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Sénégal", strength: 9, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Côte d'Ivoire", strength: 9, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Égypte", strength: 9, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Nigeria", strength: 9, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Algérie", strength: 8, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Cameroun", strength: 8, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Tunisie", strength: 8, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Mali", strength: 8, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Afrique du Sud", strength: 7, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "RD Congo", strength: 7, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Ghana", strength: 7, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Burkina Faso", strength: 7, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Guinée", strength: 6, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Cap-Vert", strength: 6, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Gabon", strength: 6, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Zambie", strength: 6, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Guinée Équatoriale", strength: 6, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Angola", strength: 5, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Bénin", strength: 5, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Madagascar", strength: 5, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Ouganda", strength: 5, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Mauritanie", strength: 4, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 },
                    { name: "Mozambique", strength: 4, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0 }
                ],
                schedule: []
            }
        ];

        let activeLeagueIndex = 0;
        let activeTab = 'pronostics';
        let secondsRemaining = 120;

        function generateSchedule(league) {
            league.schedule = [];
            let rotation = [...league.teams];
            let numTeams = rotation.length;

            for (let j = 0; j < league.maxJournees; j++) {
                let dayMatches = [];
                for (let i = 0; i < numTeams / 2; i++) {
                    let home = rotation[i];
                    let away = rotation[numTeams - 1 - i];
                    if (j % 2 === 1) { let temp = home; home = away; away = temp; }

                    let pHome = simulateGoals(home.strength, away.strength, true);
                    let pAway = simulateGoals(away.strength, home.strength, false);

                    dayMatches.push({
                        home: home.name,
                        away: away.name,
                        predHome: pHome,
                        predAway: pAway,
                        actualHome: null,
                        actualAway: null
                    });
                }
                league.schedule.push(dayMatches);
                let last = rotation.pop();
                rotation.splice(1, 0, last);
            }
        }

        function simulateGoals(att, def, isHome) {
            let chance = (att - (def * 0.4)) / 3.0;
            if (isHome) chance += 0.35;
            if (chance < 0.3) chance = 0.3;
            let goals = 0;
            for (let i = 0; i < 5; i++) {
                if (Math.random() < (chance / 4.2)) goals++;
            }
            return goals;
        }

        function playRound() {
            leagues.forEach(league => {
                let matches = league.schedule[league.currentJournee - 1];
                matches.forEach(match => {
                    let hTeam = league.teams.find(t => t.name === match.home);
                    let aTeam = league.teams.find(t => t.name === match.away);

                    let hGoals = Math.random() < 0.45 ? match.predHome : simulateGoals(hTeam.strength, aTeam.strength, true);
                    let aGoals = Math.random() < 0.45 ? match.predAway : simulateGoals(aTeam.strength, hTeam.strength, false);

                    match.actualHome = hGoals;
                    match.actualAway = aGoals;

                    hTeam.played++; aTeam.played++;
                    hTeam.gf += hGoals; hTeam.ga += aGoals;
                    aTeam.gf += aGoals; aTeam.ga += hGoals;

                    if (hGoals > aGoals) { hTeam.won++; aTeam.lost++; }
                    else if (hGoals < aGoals) { aTeam.won++; hTeam.lost++; }
                    else { hTeam.drawn++; aTeam.drawn++; }
                });

                if (league.currentJournee < league.maxJournees) {
                    league.currentJournee++;
                } else {
                    league.currentJournee = 1;
                    league.teams.forEach(t => { t.played=0; t.won=0; t.drawn=0; t.lost=0; t.gf=0; t.ga=0; });
                    generateSchedule(league);
                }
            });
            secondsRemaining = 120;
            render();
        }

        // Timer
        setInterval(() => {
            if (secondsRemaining > 0) {
                secondsRemaining--;
            } else {
                playRound();
            }
            updateTimerDisplay();
        }, 1000);

        function triggerNextRound() {
            playRound();
        }

        function updateTimerDisplay() {
            let m = Math.floor(secondsRemaining / 60).toString().padStart(2, '0');
            let s = (secondsRemaining % 60).toString().padStart(2, '0');
            document.getElementById('timer-text').innerText = `${m}:${s}`;
        }

        function switchLeague(index) {
            activeLeagueIndex = index;
            document.getElementById('btn-league-0').className = index === 0 ? "p-3 rounded-xl font-bold text-center transition border border-emerald-500 bg-emerald-500 text-black" : "p-3 rounded-xl font-bold text-center transition border border-white/10 bg-[#1E293B] text-white";
            document.getElementById('btn-league-1').className = index === 1 ? "p-3 rounded-xl font-bold text-center transition border border-emerald-500 bg-emerald-500 text-black" : "p-3 rounded-xl font-bold text-center transition border border-white/10 bg-[#1E293B] text-white";
            render();
        }

        function switchTab(tab) {
            activeTab = tab;
            ['pronostics', 'resultats', 'classement'].forEach(t => {
                document.getElementById(`tab-${t}`).className = t === tab ? "flex-1 py-3 text-center text-emerald-400 border-b-2 border-emerald-400 font-bold" : "flex-1 py-3 text-center text-white/60 font-bold";
                document.getElementById(`view-${t}`).classList.toggle('hidden', t !== tab);
            });
            render();
        }

        function render() {
            let league = leagues[activeLeagueIndex];
            document.getElementById('active-league-name').innerText = league.name;
            document.getElementById('journee-badge').innerText = `JOURNÉE ${league.currentJournee} / ${league.maxJournees}`;
            document.getElementById(`sub-league-0`).innerText = `J${leagues[0].currentJournee} / 38`;
            document.getElementById(`sub-league-1`).innerText = `J${leagues[1].currentJournee} / 46`;

            // Pronostics View
            let pDiv = document.getElementById('view-pronostics');
            let currentMatches = league.schedule[league.currentJournee - 1] || [];
            pDiv.innerHTML = currentMatches.map(m => `
                <div class="bg-[#1E293B] p-3 rounded-xl border border-white/5 shadow">
                    <div class="flex justify-between items-center text-sm font-bold">
                        <span class="flex-1">${m.home}</span>
                        <span class="text-amber-400 px-2 text-xs bg-white/5 py-1 rounded">VS</span>
                        <span class="flex-1 text-right">${m.away}</span>
                    </div>
                    <div class="border-t border-white/5 my-2"></div>
                    <div class="flex justify-between text-xs">
                        <span class="bg-blue-500/10 border border-blue-500/30 text-blue-300 px-2 py-1 rounded">Score Exact: <b>${m.predHome} - ${m.predAway}</b></span>
                        <span class="bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 px-2 py-1 rounded">Total Buts: <b>${(m.predHome+m.predAway)>2?'Over 2.5 ('+(m.predHome+m.predAway)+')':'Under 2.5 ('+(m.predHome+m.predAway)+')'}</b></span>
                    </div>
                </div>
            `).join('');

            // Resultats View
            let rDiv = document.getElementById('view-resultats');
            let prevJ = league.currentJournee - 1;
            if (prevJ < 1) {
                rDiv.innerHTML = `<div class="text-center text-white/60 py-10 text-sm">Mbola eo amin'ny Journée 1 izao.<br>Andraso ny timer na tsindrio ny bokotra <b>⏩ Test</b> eo ambony!</div>`;
            } else {
                let prevMatches = league.schedule[prevJ - 1];
                rDiv.innerHTML = `<div class="text-center text-amber-400 font-bold text-xs mb-2">VALIN-DALAO - JOURNÉE ${prevJ}</div>` + prevMatches.map(m => `
                    <div class="bg-[#1E293B] p-3 rounded-xl border border-white/5">
                        <div class="flex justify-between items-center">
                            <span class="flex-1 font-semibold text-sm">${m.home}</span>
                            <span class="bg-emerald-500/20 border border-emerald-500 text-emerald-400 px-3 py-1 rounded font-bold text-sm">${m.actualHome} - ${m.actualAway}</span>
                            <span class="flex-1 text-right font-semibold text-sm">${m.away}</span>
                        </div>
                    </div>
                `).join('');
            }

            // Classement View
            let cDiv = document.getElementById('view-classement');
            let sortedTeams = [...league.teams].sort((a,b) => {
                let ptsA = (a.won*3) + a.drawn;
                let ptsB = (b.won*3) + b.drawn;
                if (ptsB !== ptsA) return ptsB - ptsA;
                let diffA = a.gf - a.ga;
                let diffB = b.gf - b.ga;
                if (diffB !== diffA) return diffB - diffA;
                return b.gf - a.gf;
            });

            cDiv.innerHTML = `
                <table class="w-full text-left text-xs bg-[#1E293B] rounded-xl overflow-hidden">
                    <thead class="bg-black/30 text-white/70">
                        <tr>
                            <th class="p-2">#</th>
                            <th class="p-2">Ekipa</th>
                            <th class="p-2 text-center">MJ</th>
                            <th class="p-2 text-center">DB</th>
                            <th class="p-2 text-center text-emerald-400">PTS</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-white/5">
                        ${sortedTeams.map((t, idx) => `
                            <tr class="hover:bg-white/5">
                                <td class="p-2 font-bold ${idx<4?'text-emerald-400':(idx>=sortedTeams.length-3?'text-red-400':'')}">${idx+1}</td>
                                <td class="p-2 font-semibold">${t.name}</td>
                                <td class="p-2 text-center text-white/70">${t.played}</td>
                                <td class="p-2 text-center text-white/70">${(t.gf - t.ga) > 0 ? '+'+(t.gf - t.ga) : (t.gf - t.ga)}</td>
                                <td class="p-2 text-center font-bold text-emerald-400">${(t.won*3) + t.drawn}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        // Init
        generateSchedule(leagues[0]);
        generateSchedule(leagues[1]);
        render();
    </script>
</body>
</html>
