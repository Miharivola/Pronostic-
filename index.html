<body class="min-h-screen flex flex-col select-none">

    <!-- MARKETS (1X2, Mi-tps, Double Chance) -->

        <button class="bg-[#E11D48] text-white px-3 py-1.5 rounded-lg shadow">1X2</button>
        <button class="bg-white/10 text-slate-300 px-3 py-1.5 rounded-lg hover:bg-white/20">Mi-tps 1X2</button>
        <button class="bg-white/10 text-slate-300 px-3 py-1.5 rounded-lg hover:bg-white/20">Double Chance</button>
        <button class="bg-white/10 text-slate-300 px-3 py-1.5 rounded-lg hover:bg-white/20">Mi-tps DC</button>
    </div>

    <!-- BARRE JOURNEE & TABS -->
    <div class="bg-[#162032] sticky top-[57px] z-40 shadow-md">
        <div class="px-4 py-2 flex justify-between items-center border-b border-white/5 text-xs">
            <div class="flex items-center space-x-2">
                <span id="active-league-name" class="text-slate-300 font-bold uppercase tracking-wider">ENGLISH LEAGUE</span>
                <span class="text-[10px] text-emerald-400 bg-emerald-500/10 px-1.5 py-0.5 rounded border border-emerald-500/20 font-mono" id="active-slot-label">Manomboka --:--</span>
            </div>
            <span id="journee-badge" class="bg-amber-500/20 border border-amber-500/30 text-amber-400 px-2.5 py-0.5 rounded-md font-extrabold tracking-wide">JOURNÉE 1 / 38</span>
        </div>

        <div class="flex text-xs font-extrabold tracking-wide">
            <button onclick="switchTab('pronostics')" id="tab-pronostics" class="flex-1 py-3 text-center text-emerald-400 border-b-2 border-emerald-400 bg-emerald-500/5 transition">
                COTES & PRONOSTICS
            </button>
            <button onclick="switchTab('resultats')" id="tab-resultats" class="flex-1 py-3 text-center text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition">
                RÉSULTATS
            </button>
            <button onclick="switchTab('classement')" id="tab-classement" class="flex-1 py-3 text-center text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition">
                CLASSEMENT
            </button>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <main class="flex-1 p-3 max-w-2xl mx-auto w-full pb-12">
        <div id="view-pronostics">
            <div class="flex items-center px-3 py-1.5 text-[11px] font-bold text-slate-400 uppercase tracking-wider">
                <div class="flex-1">Lalao (Matchs)</div>
                <div class="w-[168px] grid grid-cols-3 gap-1.5 text-center">
                    <span>1</span>
                    <span>X</span>
                    <span>2</span>
                </div>
            </div>
            <div id="matches-container" class="space-y-2.5"></div>
        </div>

        <div id="view-resultats" class="space-y-2.5 hidden"></div>
        <div id="view-classement" class="hidden"></div>
    </main>

    <script>
        // --- DATA EKIPA MARINA AVY AMIN'NY BET261 ---
        const baseTeamsData = [
            {
                name: "English League",
                maxJournees: 38,
                teams: [
                    { name: "Manchester Blue", color: "#38BDF8", rating: 9.8 },
                    { name: "Liverpool", color: "#DC2626", rating: 9.5 },

                    { name: "Newcastle", color: "#94A3B8", rating: 8.1 },
                    { name: "Spurs", color: "#F8FAFC", rating: 7.9 },
                    { name: "Manchester Red", color: "#B91C1C", rating: 7.6 },
                    { name: "A. Villa", color: "#9F1239", rating: 7.4 },
                    { name: "Brighton", color: "#0284C7", rating: 7.2 },
                    { name: "West Ham", color: "#881337", rating: 6.8 },
                    { name: "C. Palace", color: "#1D4ED8", rating: 6.5 },
                    { name: "Fulham", color: "#E2E8F0", rating: 6.4 },
                    { name: "Brentford", color: "#E11D48", rating: 6.2 },

                    { name: "Everton", color: "#1E40AF", rating: 5.8 },
                    { name: "Wolverhampton", color: "#F59E0B", rating: 5.5 },
                    { name: "N. Forest", color: "#DC2626", rating: 5.0 },
                    { name: "Burnley", color: "#701A75", rating: 4.5 },
                    { name: "Leeds", color: "#FACC15", rating: 4.3 },
                    { name: "Sunderland", color: "#EF4444", rating: 3.6 }
                ]
            },
            {
                name: "Coupe d'Afrique",
                maxJournees: 46,
                teams: [
                    { name: "Maroc", color: "#DC2626", rating: 9.6 },
                    { name: "Sénégal", color: "#16A34A", rating: 9.3 },
                    { name: "Côte d'Ivoire", color: "#F97316", rating: 9.0 },
                    { name: "Égypte", color: "#B91C1C", rating: 8.9 },
                    { name: "Nigeria", color: "#15803D", rating: 8.8 },
                    { name: "Algérie", color: "#22C55E", rating: 8.3 },
                    { name: "Cameroun", color: "#166534", rating: 8.1 },
                    { name: "Tunisie", color: "#EF4444", rating: 7.9 },
                    { name: "Mali", color: "#EAB308", rating: 7.7 },
                    { name: "Afrique du Sud", color: "#CA8A04", rating: 7.3 },
                    { name: "RD Congo", color: "#2563EB", rating: 7.1 },
                    { name: "Ghana", color: "#FACC15", rating: 6.9 },
                    { name: "Burkina Faso", color: "#DC2626", rating: 6.7 },
                    { name: "Guinée", color: "#E11D48", rating: 6.3 },
                    { name: "Cap-Vert", color: "#1D4ED8", rating: 6.1 },
                    { name: "Gabon", color: "#10B981", rating: 5.9 },
                    { name: "Zambie", color: "#15803D", rating: 5.7 },
                    { name: "Guinée Équat.", color: "#EF4444", rating: 5.5 },
                    { name: "Angola", color: "#991B1B", rating: 5.2 },
                    { name: "Bénin", color: "#F59E0B", rating: 4.9 },
                    { name: "Madagascar", color: "#16A34A", rating: 4.7 },
                    { name: "Ouganda", color: "#EAB308", rating: 4.4 },
                    { name: "Mauritanie", color: "#166534", rating: 4.0 },
                    { name: "Mozambique", color: "#DC2626", rating: 3.7 }
                ]
            }
        ];

        // --- ALGORITHM & TIME SYNC ---
        const EPOCH_OFFSET_MS = 60 * 1000; // Impair minute sync
        const CYCLE_DURATION_MS = 120 * 1000; // 2 min per matchday

        function getCurrentCycleInfo() {
            const nowMs = Date.now();
            const tzOffsetMs = new Date().getTimezoneOffset() * 60 * 1000;
            const localMs = nowMs - tzOffsetMs;
            const adjustedMs = localMs - EPOCH_OFFSET_MS;
            const cycleIndex = Math.floor(adjustedMs / CYCLE_DURATION_MS);
            const msIntoCycle = adjustedMs % CYCLE_DURATION_MS;
            const secondsRemaining = Math.ceil((CYCLE_DURATION_MS - msIntoCycle) / 1000);
            const nextStartLocalMs = ((cycleIndex + 1) * CYCLE_DURATION_MS) + EPOCH_OFFSET_MS + tzOffsetMs;

            return {
                cycleIndex,
                secondsRemaining: secondsRemaining === 120 ? 0 : secondsRemaining,
                nextStartMs: nextStartLocalMs
            };
        }

        function formatHHMM(timestampMs) {
            const d = new Date(timestampMs);
            return `${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
        }

        function seededRandom(seed) {
            let x = Math.sin(seed * 12.9898 + 78.233) * 43758.5453;
            return x - Math.floor(x);
        }

        function calculateBet261Odds(homeRating, awayRating, matchSeed) {
            let diff = (homeRating + 0.55) - awayRating;
            let rawProb1 = 1 / (1 + Math.exp(-0.46 * diff));
            let rawProb2 = 1 / (1 + Math.exp(0.46 * diff));
            let drawBase = Math.max(0.072, 0.285 * Math.exp(-0.075 * (diff * diff)));

            let totalRaw = rawProb1 + rawProb2 + drawBase;
            let p1 = rawProb1 / totalRaw;
            let pX = drawBase / totalRaw;
            let p2 = rawProb2 / totalRaw;

            let jitter = (seededRandom(matchSeed + 99) - 0.5) * 0.03;
            p1 = Math.max(0.06, Math.min(0.84, p1 + jitter));
            p2 = Math.max(0.06, Math.min(0.84, p2 - jitter));
            pX = Math.max(0.07, 1 - (p1 + p2));

            const rtp = 0.935;
            return {
                c1: Math.max(1.12, rtp / p1).toFixed(2).replace('.', ','),
                cX: Math.max(2.85, rtp / pX).toFixed(2).replace('.', ','),
                c2: Math.max(1.15, rtp / p2).toFixed(2).replace('.', ',')
            };
        }

        // --- STRATEGY & MAX 6 BUTS ALGORITHM ---
        function simulateMatchGoalsCapped(homeRating, awayRating, seed) {
            let diff = (homeRating + 0.5) - awayRating;
            let xgHome = Math.max(0.25, Math.min(2.6, 1.35 + (diff * 0.22)));
            let xgAway = Math.max(0.20, Math.min(2.3, 1.05 - (diff * 0.18)));

            let hGoals = 0;
            let aGoals = 0;

            for (let i = 0; i < 4; i++) {
                if (seededRandom(seed + i * 13.7) < (xgHome / 4.2)) hGoals++;
                if (seededRandom(seed + i * 29.3) < (xgAway / 4.2)) aGoals++;
            }

            // Tsy mihoatra ny 6 ny fitambaran'ny baolina (Max 6 buts)
            while ((hGoals + aGoals) > 6) {
                if (hGoals >= aGoals && hGoals > 0) hGoals--;
                else if (aGoals > 0) aGoals--;
            }

            return { homeGoals: hGoals, awayGoals: aGoals };
        }

        function buildSeasonData(leagueIdx, seasonNumber) {
            const leagueMeta = baseTeamsData[leagueIdx];
            const teams = leagueMeta.teams.map(t => ({
                ...t, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0
            }));

            let rotation = [...teams];
            let numTeams = rotation.length;
            let schedule = [];

            for (let j = 0; j < leagueMeta.maxJournees; j++) {
                let dayMatches = [];
                for (let i = 0; i < numTeams / 2; i++) {
                    let home = rotation[i];
                    let away = rotation[numTeams - 1 - i];
                    if (j % 2 === 1) { let temp = home; home = away; away = temp; }

                    let matchSeed = (seasonNumber * 10000) + (leagueIdx * 5000) + (j * 100) + i;
                    let odds = calculateBet261Odds(home.rating, away.rating, matchSeed);
                    let pred = simulateMatchGoalsCapped(home.rating, away.rating, matchSeed + 10);
                    let actual = seededRandom(matchSeed + 50) < 0.42 ? pred : simulateMatchGoalsCapped(home.rating, away.rating, matchSeed + 77);

                    dayMatches.push({
                        home: home.name,
                        homeColor: home.color,
                        away: away.name,
                        awayColor: away.color,
                        cote1: odds.c1,
                        coteX: odds.cX,
                        cote2: odds.c2,
                        predHome: pred.homeGoals,
                        predAway: pred.awayGoals,
                        actualHome: actual.homeGoals,
                        actualAway: actual.awayGoals
                    });
                }

                dayMatches.sort((a, b) => seededRandom(seasonNumber * 100 + j + a.home.length) - seededRandom(seasonNumber * 100 + j + b.home.length));
                schedule.push(dayMatches);
                let last = rotation.pop();
                rotation.splice(1, 0, last);
            }

            return { teams, schedule };
        }

        function getLiveLeagueState(leagueIdx, cycleIndex) {
            const leagueMeta = baseTeamsData[leagueIdx];
            const maxJ = leagueMeta.maxJournees;
            const seasonNumber = Math.floor(cycleIndex / maxJ);
            const currentJournee = (cycleIndex % maxJ) + 1;
            const seasonData = buildSeasonData(leagueIdx, seasonNumber);

            for (let j = 0; j < currentJournee - 1; j++) {
                seasonData.schedule[j].forEach(m => {
                    let hTeam = seasonData.teams.find(t => t.name === m.home);
                    let aTeam = seasonData.teams.find(t => t.name === m.away);

                    hTeam.played++; aTeam.played++;
                    hTeam.gf += m.actualHome; hTeam.ga += m.actualAway;
                    aTeam.gf += m.actualAway; aTeam.ga += m.actualHome;

                    if (m.actualHome > m.actualAway) { hTeam.won++; aTeam.lost++; }
                    else if (m.actualHome < m.actualAway) { aTeam.won++; hTeam.lost++; }
                    else { hTeam.drawn++; aTeam.drawn++; }
                });
            }

            return {
                name: leagueMeta.name,
                maxJournees: maxJ,
                currentJournee,
                teams: seasonData.teams,
                schedule: seasonData.schedule
            };
        }

        // --- UI & RENDERING ---
        let activeLeagueIndex = 0;
        let activeTab = 'pronostics';
        let lastRenderedCycle = -1;

        function switchLeague(index) {
            activeLeagueIndex = index;
            document.getElementById('btn-league-0').className = index === 0 ? "p-2.5 rounded-xl font-bold text-left transition-all border border-emerald-500 bg-gradient-to-r from-emerald-500 to-emerald-600 text-slate-950 shadow-md" : "p-2.5 rounded-xl font-bold text-left transition-all border border-white/10 bg-[#162032] text-white hover:bg-[#1E293B]";
            document.getElementById('btn-league-1').className = index === 1 ? "p-2.5 rounded-xl font-bold text-left transition-all border border-emerald-500 bg-gradient-to-r from-emerald-500 to-emerald-600 text-slate-950 shadow-md" : "p-2.5 rounded-xl font-bold text-left transition-all border border-white/10 bg-[#162032] text-white hover:bg-[#1E293B]";
            renderAll(true);
        }

        function switchTab(tab) {
            activeTab = tab;
            ['pronostics', 'resultats', 'classement'].forEach(t => {
                document.getElementById(`tab-${t}`).className = t === tab ? "flex-1 py-3 text-center text-emerald-400 border-b-2 border-emerald-400 bg-emerald-500/5 transition font-extrabold" : "flex-1 py-3 text-center text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition font-extrabold";
                document.getElementById(`view-${t}`).classList.toggle('hidden', t !== tab);
            });
            renderAll(true);
        }

        function renderTimeSlots(nextStartMs) {
            const bar = document.getElementById('time-slots-bar');
            document.getElementById('active-slot-label').innerText = `Manomboka ${formatHHMM(nextStartMs)}`;

            let slotsHtml = `<div class="bg-white text-[#52B755] font-black text-[10px] px-2 py-1 rounded shadow-sm flex-shrink-0">NEW</div>`;
            for (let i = 0; i < 5; i++) {
                let slotTime = formatHHMM(nextStartMs + (i * CYCLE_DURATION_MS));
                if (i === 0) {
                    slotsHtml += `<div class="bg-[#E11D48] text-white font-extrabold text-xs px-3 py-1 rounded-md shadow-md flex-shrink-0 border border-white/20">${slotTime}</div>`;
                } else {
                    slotsHtml += `<div class="text-white/90 font-bold text-xs px-2.5 py-1 border-l border-white/25 flex-shrink-0">${slotTime}</div>`;
                }
            }
            bar.innerHTML = slotsHtml;
        }

        function renderAll(force = false) {
            const cycleInfo = getCurrentCycleInfo();
            document.getElementById('real-clock').innerText = new Date().toTimeString().split(' ')[0];

            let rem = cycleInfo.secondsRemaining;
            document.getElementById('timer-text').innerText = `${Math.floor(rem / 60).toString().padStart(2, '0')}:${(rem % 60).toString().padStart(2, '0')}`;

            if (!force && cycleInfo.cycleIndex === lastRenderedCycle) return;
            lastRenderedCycle = cycleInfo.cycleIndex;

            renderTimeSlots(cycleInfo.nextStartMs);

            const engState = getLiveLeagueState(0, cycleInfo.cycleIndex);
            const canState = getLiveLeagueState(1, cycleInfo.cycleIndex);
            const activeLeague = activeLeagueIndex === 0 ? engState : canState;

            document.getElementById('sub-league-0').innerText = `J${engState.currentJournee}/38`;
            document.getElementById('sub-league-1').innerText = `J${canState.currentJournee}/46`;
            document.getElementById('active-league-name').innerText = activeLeague.name.toUpperCase();
            document.getElementById('journee-badge').innerText = `JOURNÉE ${activeLeague.currentJournee} / ${activeLeague.maxJournees}`;

            // 1. PRONOSTICS
            document.getElementById('matches-container').innerHTML = (activeLeague.schedule[activeLeague.currentJournee - 1] || []).map(m => `
                <div class="bg-[#162032] rounded-xl border border-white/10 overflow-hidden shadow-md">
                    <div class="p-3 flex items-center justify-between gap-2">
                        <div class="flex-1 space-y-2 min-w-0">
                            <div class="flex items-center space-x-2"><span class="w-3 h-3 rounded-full border border-white/20" style="background-color: ${m.homeColor}"></span><span class="text-white font-bold text-sm truncate">${m.home}</span></div>
                            <div class="flex items-center space-x-2"><span class="w-3 h-3 rounded-full border border-white/20" style="background-color: ${m.awayColor}"></span><span class="text-white font-bold text-sm truncate">${m.away}</span></div>
                        </div>
                        <div class="w-[168px] grid grid-cols-3 gap-1.5 flex-shrink-0">
                            <div class="bg-[#52B755] text-white font-extrabold text-xs py-3 rounded-md text-center">${m.cote1}</div>
                            <div class="bg-[#52B755] text-white font-extrabold text-xs py-3 rounded-md text-center">${m.coteX}</div>
                            <div class="bg-[#52B755] text-white font-extrabold text-xs py-3 rounded-md text-center">${m.cote2}</div>
                        </div>
                    </div>
                    <div class="bg-[#0F172A]/80 px-3 py-2 border-t border-white/5 flex justify-between items-center text-xs">
                        <span class="text-slate-400">Score Exact: <b class="text-blue-300 bg-blue-500/20 px-2 py-0.5 rounded border border-blue-500/40">${m.predHome} - ${m.predAway}</b></span>
                        <span class="text-slate-400">Total Buts: <b class="text-emerald-300 bg-emerald-500/20 px-2 py-0.5 rounded border border-emerald-500/40">${(m.predHome+m.predAway)>2?'Over 2.5 ('+(m.predHome+m.predAway)+')':'Under 2.5 ('+(m.predHome+m.predAway)+')'}</b></span>
                    </div>
                </div>
            `).join('');

            // 2. RÉSULTATS
            let prevJ = activeLeague.currentJournee - 1;
            let prevMatches = prevJ >= 1 ? activeLeague.schedule[prevJ - 1] : buildSeasonData(activeLeagueIndex, Math.floor(cycleInfo.cycleIndex / activeLeague.maxJournees) - 1).schedule[activeLeague.maxJournees - 1];
            document.getElementById('view-resultats').innerHTML = `<div class="bg-amber-500/10 border border-amber-500/30 text-amber-400 text-center font-extrabold text-xs py-2 rounded-lg mb-2">VALIN-DALAO - JOURNÉE ${prevJ >= 1 ? prevJ : activeLeague.maxJournees}</div>` + prevMatches.map(m => `
                <div class="bg-[#162032] p-3 rounded-xl border border-white/10 shadow-sm">
                    <div class="flex justify-between items-center">
                        <div class="flex-1 flex items-center space-x-2 min-w-0"><span class="w-2.5 h-2.5 rounded-full" style="background-color: ${m.homeColor}"></span><span class="font-bold text-sm text-white truncate">${m.home}</span></div>
                        <div class="px-3 py-1 bg-emerald-500/20 border border-emerald-500 text-emerald-400 rounded-lg font-black text-sm mx-2">${m.actualHome} - ${m.actualAway}</div>
                        <div class="flex-1 flex items-center justify-end space-x-2 min-w-0"><span class="font-bold text-sm text-white truncate">${m.away}</span><span class="w-2.5 h-2.5 rounded-full" style="background-color: ${m.awayColor}"></span></div>
                    </div>
                </div>
            `).join('');

            // 3. CLASSEMENT
            let sortedTeams = [...activeLeague.teams].sort((a, b) => ((b.won*3)+b.drawn) - ((a.won*3)+a.drawn) || (b.gf-b.ga) - (a.gf-a.ga) || b.gf - a.gf);
            document.getElementById('view-classement').innerHTML = `
                <div class="bg-[#162032] rounded-xl border border-white/10 overflow-hidden shadow-md">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-black/40 text-slate-400 uppercase text-[11px] border-b border-white/10">
                            <tr><th class="py-2.5 px-2.5 text-center">#</th><th class="py-2.5 px-2">Ekipa</th><th class="py-2.5 px-2 text-center">MJ</th><th class="py-2.5 px-2 text-center">DB</th><th class="py-2.5 px-3 text-center text-emerald-400 font-black">PTS</th></tr>
                        </thead>
                        <tbody class="divide-y divide-white/5">
                            ${sortedTeams.map((t, idx) => `
                                <tr class="hover:bg-white/5">
                                    <td class="py-2.5 px-2.5 text-center font-bold ${idx<4?'text-emerald-400':(idx>=sortedTeams.length-3?'text-red-400':'text-slate-400')}">${idx+1}</td>
                                    <td class="py-2.5 px-2 font-bold text-white flex items-center space-x-2"><span class="w-2.5 h-2.5 rounded-full" style="background-color: ${t.color}"></span><span class="truncate">${t.name}</span></td>
                                    <td class="py-2.5 px-2 text-center text-slate-300">${t.played}</td>

                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        setInterval(() => renderAll(false), 1000);
        renderAll(true);
    </script>
</body>
