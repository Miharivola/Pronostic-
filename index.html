    <!-- TSIPIKA ORA BET261 (13:21, 13:23, 13:25, 13:27, 13:29) -->
    <div class="bg-[#52B755] px-2 py-1.5 flex items-center justify-between space-x-1 overflow-x-auto shadow-inner" id="time-slots-bar">
        <!-- Fenoin'ny JS ho azy -->

    <!-- BARRE JOURNEE & TABS -->

            <div class="flex items-center space-x-2">
                <span id="active-league-name" class="text-slate-300 font-bold uppercase tracking-wider">ENGLISH LEAGUE</span>
                <span class="text-[10px] text-emerald-400 bg-emerald-500/10 px-1.5 py-0.5 rounded border border-emerald-500/20 font-mono" id="active-slot-label">Manomboka 13:21</span>
            </div>
            <span id="journee-badge" class="bg-amber-500/20 border border-amber-500/30 text-amber-400 px-2.5 py-0.5 rounded-md font-extrabold tracking-wide">JOURNÉE 1 / 38</span>
        </div>

        <div class="flex text-xs font-extrabold tracking-wide">
            <button onclick="switchTab('pronostics')" id="tab-pronostics" class="flex-1 py-3 text-center text-emerald-400 border-b-2 border-emerald-400 bg-emerald-500/5 transition">
                COTES & PRONOSTICS
            </button>
            <button onclick="switchTab('resultats')" id="tab-resultats" class="flex-1 py-3 text-center text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition">
                RÉSULTATS

            <button onclick="switchTab('classement')" id="tab-classement" class="flex-1 py-3 text-center text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition">
                CLASSEMENT

        </div>
    </div>

    <!-- VOTOATINY (CONTENT) -->
    <main class="flex-1 p-3 max-w-2xl mx-auto w-full pb-12">
        <!-- Fizarana 1: Pronostics & Cotes 1 X 2 -->
        <div id="view-pronostics">
            <div class="flex items-center px-3 py-1.5 text-[11px] font-bold text-slate-400 uppercase tracking-wider">
                <div class="flex-1">Lalao (Matchs)</div>
                <div class="w-[168px] grid grid-cols-3 gap-1.5 text-center">
                    <span>1</span>
                    <span>X</span>
                    <span>2</span>
                </div>
            </div>
            <div id="matches-container" class="space-y-2.5"></div>
        </div>

        <!-- Fizarana 2: Résultats -->
        <div id="view-resultats" class="space-y-2.5 hidden"></div>

        <!-- Fizarana 3: Classement -->
        <div id="view-classement" class="hidden"></div>
    </main>

    <script>
        // --- DATA EKIPA (Mitovy tanteraka amin'ny Bet261) ---
        const baseTeamsData = [
            {
                name: "English League",
                maxJournees: 38,
                teams: [
                    { name: "Manchester Blue", color: "#38BDF8", strength: 10 },
                    { name: "London Reds", color: "#EF4444", strength: 9 },
                    { name: "Liverpool", color: "#DC2626", strength: 9 },
                    { name: "London Blues", color: "#2563EB", strength: 8 },
                    { name: "Spurs", color: "#F8FAFC", strength: 8 },
                    { name: "Newcastle", color: "#94A3B8", strength: 8 },
                    { name: "A. Villa", color: "#9F1239", strength: 7 },
                    { name: "Manchester Red", color: "#B91C1C", strength: 7 },
                    { name: "Brighton", color: "#0284C7", strength: 7 },
                    { name: "West Ham", color: "#881337", strength: 6 },
                    { name: "Brentford", color: "#E11D48", strength: 6 },
                    { name: "C. Palace", color: "#1D4ED8", strength: 6 },
                    { name: "Fulham", color: "#E2E8F0", strength: 6 },
                    { name: "Wolverhampton", color: "#F59E0B", strength: 5 },
                    { name: "Bournemouth", color: "#991B1B", strength: 5 },
                    { name: "Everton", color: "#1E40AF", strength: 5 },
                    { name: "N. Forest", color: "#DC2626", strength: 5 },
                    { name: "Leeds", color: "#FACC15", strength: 4 },
                    { name: "Burnley", color: "#701A75", strength: 4 },
                    { name: "Sunderland", color: "#EF4444", strength: 4 }
                ]
            },
            {
                name: "Coupe d'Afrique",
                maxJournees: 46,
                teams: [
                    { name: "Maroc", color: "#DC2626", strength: 10 },
                    { name: "Sénégal", color: "#16A34A", strength: 9 },
                    { name: "Côte d'Ivoire", color: "#F97316", strength: 9 },
                    { name: "Égypte", color: "#B91C1C", strength: 9 },
                    { name: "Nigeria", color: "#15803D", strength: 9 },
                    { name: "Algérie", color: "#22C55E", strength: 8 },
                    { name: "Cameroun", color: "#166534", strength: 8 },
                    { name: "Tunisie", color: "#EF4444", strength: 8 },
                    { name: "Mali", color: "#EAB308", strength: 8 },
                    { name: "Afrique du Sud", color: "#CA8A04", strength: 7 },
                    { name: "RD Congo", color: "#2563EB", strength: 7 },
                    { name: "Ghana", color: "#FACC15", strength: 7 },
                    { name: "Burkina Faso", color: "#DC2626", strength: 7 },
                    { name: "Guinée", color: "#E11D48", strength: 6 },
                    { name: "Cap-Vert", color: "#1D4ED8", strength: 6 },
                    { name: "Gabon", color: "#10B981", strength: 6 },
                    { name: "Zambie", color: "#15803D", strength: 6 },
                    { name: "Guinée Équat.", color: "#EF4444", strength: 6 },
                    { name: "Angola", color: "#991B1B", strength: 5 },
                    { name: "Bénin", color: "#F59E0B", strength: 5 },
                    { name: "Madagascar", color: "#16A34A", strength: 5 },
                    { name: "Ouganda", color: "#EAB308", strength: 5 },
                    { name: "Mauritanie", color: "#166534", strength: 4 },
                    { name: "Mozambique", color: "#DC2626", strength: 4 }
                ]
            }
        ];

        // --- RAFITRA ORA TENA IZY (SYNC AMIN'NY BET261) ---
        // Ao amin'ny Bet261, ny lalao vaovao dia manomboka amin'ny minitra tsy ankasa (impair: 01, 03, 05, ..., 21, 23, 25...)
        // Ny tsingerina iray dia 120 segondra (2 minitra), manomboka amin'ny 00:01:00 (60 segondra aorian'ny misasakalina)
        const EPOCH_OFFSET_MS = 60 * 1000; // Manomboka amin'ny minitra 01, 03, 05...
        const CYCLE_DURATION_MS = 120 * 1000; // 2 minitra isaky ny journée

        function getCurrentCycleInfo() {
            const nowMs = Date.now();
            // Mampiasa ny ora eo an-toerana (Local Timezone offset)
            const tzOffsetMs = new Date().getTimezoneOffset() * 60 * 1000;
            const localMs = nowMs - tzOffsetMs;

            const adjustedMs = localMs - EPOCH_OFFSET_MS;
            const cycleIndex = Math.floor(adjustedMs / CYCLE_DURATION_MS);
            const msIntoCycle = adjustedMs % CYCLE_DURATION_MS;
            const secondsRemaining = Math.ceil((CYCLE_DURATION_MS - msIntoCycle) / 1000);

            // Ny ora fanombohan'ny lalao manaraka (tsindriana mena ao amin'ny Bet261)
            const nextStartLocalMs = ((cycleIndex + 1) * CYCLE_DURATION_MS) + EPOCH_OFFSET_MS + tzOffsetMs;

            return {
                cycleIndex,
                secondsRemaining: secondsRemaining === 120 ? 0 : secondsRemaining,
                nextStartMs: nextStartLocalMs
            };
        }

        function formatHHMM(timestampMs) {
            const d = new Date(timestampMs);
            const hh = d.getHours().toString().padStart(2, '0');
            const mm = d.getMinutes().toString().padStart(2, '0');
            return `${hh}:${mm}`;
        }

        // PRNG (Deterministic Random) mba hitovy foana ny lalao sy ny isa isaky ny cycleIndex
        function seededRandom(seed) {
            let x = Math.sin(seed) * 10000;
            return x - Math.floor(x);
        }

        function calculateOdds(homeStrength, awayStrength) {
            let hPower = homeStrength + 0.6;
            let aPower = awayStrength;
            let diff = hPower - aPower;

            let prob1 = 0.42 + (diff * 0.065);
            let prob2 = 0.30 - (diff * 0.055);

            prob1 = Math.max(0.08, Math.min(0.84, prob1));
            prob2 = Math.max(0.06, Math.min(0.78, prob2));

            let probX = 1.0 - (prob1 + prob2);
            if (probX < 0.10) {
                probX = 0.12;
                let total = prob1 + prob2 + probX;
                prob1 /= total;
                prob2 /= total;
                probX /= total;
            }

            let margin = 0.93;
            return {
                c1: (margin / prob1).toFixed(2).replace('.', ','),
                cX: (margin / probX).toFixed(2).replace('.', ','),
                c2: (margin / prob2).toFixed(2).replace('.', ',')
            };
        }

        function simulateGoalsSeeded(att, def, isHome, seed) {
            let chance = (att - (def * 0.4)) / 3.0;
            if (isHome) chance += 0.35;
            if (chance < 0.3) chance = 0.3;
            let goals = 0;
            for (let i = 0; i < 5; i++) {
                if (seededRandom(seed + i * 17.3) < (chance / 4.2)) goals++;
            }
            return goals;
        }

        // Mamorona ny taom-pilalaovana manontolo ho an'ny Season iray (Deterministic)
        function buildSeasonData(leagueIdx, seasonNumber) {
            const leagueMeta = baseTeamsData[leagueIdx];
            const teams = leagueMeta.teams.map(t => ({
                ...t, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0
            }));

            let rotation = [...teams];
            let numTeams = rotation.length;
            let schedule = [];

            for (let j = 0; j < leagueMeta.maxJournees; j++) {
                let dayMatches = [];
                for (let i = 0; i < numTeams / 2; i++) {
                    let home = rotation[i];
                    let away = rotation[numTeams - 1 - i];
                    if (j % 2 === 1) {
                        let temp = home; home = away; away = temp;
                    }

                    let matchSeed = (seasonNumber * 10000) + (leagueIdx * 5000) + (j * 100) + i;
                    let odds = calculateOdds(home.strength, away.strength);
                    let pHome = simulateGoalsSeeded(home.strength, away.strength, true, matchSeed + 1);
                    let pAway = simulateGoalsSeeded(away.strength, home.strength, false, matchSeed + 2);

                    let aHome = seededRandom(matchSeed + 3) < 0.45 ? pHome : simulateGoalsSeeded(home.strength, away.strength, true, matchSeed + 4);
                    let aAway = seededRandom(matchSeed + 5) < 0.45 ? pAway : simulateGoalsSeeded(away.strength, home.strength, false, matchSeed + 6);

                    dayMatches.push({
                        home: home.name,
                        homeColor: home.color,
                        away: away.name,
                        awayColor: away.color,
                        cote1: odds.c1,
                        coteX: odds.cX,
                        cote2: odds.c2,
                        predHome: pHome,
                        predAway: pAway,
                        actualHome: aHome,
                        actualAway: aAway
                    });
                }
                schedule.push(dayMatches);
                let last = rotation.pop();
                rotation.splice(1, 0, last);
            }

            return { teams, schedule };
        }

        // Maka ny toerana marina misy ny lalao amin'izao segondra izao
        function getLiveLeagueState(leagueIdx, cycleIndex) {
            const leagueMeta = baseTeamsData[leagueIdx];
            const maxJ = leagueMeta.maxJournees;

            // Kajy ny saison sy ny journée ankehitriny (1 ka hatramin'ny maxJ)
            const seasonNumber = Math.floor(cycleIndex / maxJ);
            const currentJournee = (cycleIndex % maxJ) + 1;

            const seasonData = buildSeasonData(leagueIdx, seasonNumber);

            // Manisa ny classement ho an'ireo journée rehetra efa vita (1 hatramin'ny currentJournee - 1)
            for (let j = 0; j < currentJournee - 1; j++) {
                seasonData.schedule[j].forEach(m => {
                    let hTeam = seasonData.teams.find(t => t.name === m.home);
                    let aTeam = seasonData.teams.find(t => t.name === m.away);

                    hTeam.played++; aTeam.played++;
                    hTeam.gf += m.actualHome; hTeam.ga += m.actualAway;
                    aTeam.gf += m.actualAway; aTeam.ga += m.actualHome;

                    if (m.actualHome > m.actualAway) { hTeam.won++; aTeam.lost++; }
                    else if (m.actualHome < m.actualAway) { aTeam.won++; hTeam.lost++; }
                    else { hTeam.drawn++; aTeam.drawn++; }
                });
            }

            return {
                name: leagueMeta.name,
                maxJournees: maxJ,
                currentJournee,
                teams: seasonData.teams,
                schedule: seasonData.schedule
            };
        }

        // --- UI STATE & RENDERING ---
        let activeLeagueIndex = 0;
        let activeTab = 'pronostics';
        let lastRenderedCycle = -1;

        function switchLeague(index) {
            activeLeagueIndex = index;
            const btn0 = document.getElementById('btn-league-0');
            const btn1 = document.getElementById('btn-league-1');
            const sub0 = document.getElementById('sub-league-0');
            const sub1 = document.getElementById('sub-league-1');

            if (index === 0) {
                btn0.className = "p-2.5 rounded-xl font-bold text-left transition-all border border-emerald-500 bg-gradient-to-r from-emerald-500 to-emerald-600 text-slate-950 shadow-md";
                sub0.className = "text-[10px] bg-black/20 px-1.5 py-0.5 rounded font-mono font-bold text-slate-950";
                btn1.className = "p-2.5 rounded-xl font-bold text-left transition-all border border-white/10 bg-[#162032] text-white hover:bg-[#1E293B]";
                sub1.className = "text-[10px] bg-white/10 px-1.5 py-0.5 rounded font-mono text-slate-300";
            } else {
                btn1.className = "p-2.5 rounded-xl font-bold text-left transition-all border border-emerald-500 bg-gradient-to-r from-emerald-500 to-emerald-600 text-slate-950 shadow-md";
                sub1.className = "text-[10px] bg-black/20 px-1.5 py-0.5 rounded font-mono font-bold text-slate-950";
                btn0.className = "p-2.5 rounded-xl font-bold text-left transition-all border border-white/10 bg-[#162032] text-white hover:bg-[#1E293B]";
                sub0.className = "text-[10px] bg-white/10 px-1.5 py-0.5 rounded font-mono text-slate-300";
            }
            renderAll(true);
        }

        function switchTab(tab) {
            activeTab = tab;
            ['pronostics', 'resultats', 'classement'].forEach(t => {
                const tabEl = document.getElementById(`tab-${t}`);
                const viewEl = document.getElementById(`view-${t}`);
                if (t === tab) {
                    tabEl.className = "flex-1 py-3 text-center text-emerald-400 border-b-2 border-emerald-400 bg-emerald-500/5 transition font-extrabold";
                    viewEl.classList.remove('hidden');
                } else {
                    tabEl.className = "flex-1 py-3 text-center text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition font-extrabold";
                    viewEl.classList.add('hidden');
                }
            });
            renderAll(true);
        }

        function renderTimeSlots(nextStartMs) {
            const bar = document.getElementById('time-slots-bar');
            const activeSlotStr = formatHHMM(nextStartMs);
            document.getElementById('active-slot-label').innerText = `Manomboka ${activeSlotStr}`;

            let slotsHtml = `
                <div class="bg-white text-[#52B755] font-black text-[10px] px-2 py-1 rounded shadow-sm flex-shrink-0">
                    NEW
                </div>
            `;

            for (let i = 0; i < 5; i++) {
                let slotTime = formatHHMM(nextStartMs + (i * CYCLE_DURATION_MS));
                if (i === 0) {
                    // Ora ankehitriny (Mena mitovy amin'ny Bet261)
                    slotsHtml += `
                        <div class="bg-[#E11D48] text-white font-extrabold text-xs px-3 py-1 rounded-md shadow-md flex-shrink-0 border border-white/20">
                            ${slotTime}
                        </div>
                    `;
                } else {
                    slotsHtml += `
                        <div class="text-white/90 font-bold text-xs px-2.5 py-1 border-l border-white/25 flex-shrink-0">
                            ${slotTime}
                        </div>
                    `;
                }
            }
            bar.innerHTML = slotsHtml;
        }

        function renderAll(force = false) {
            const cycleInfo = getCurrentCycleInfo();
            const now = new Date();

            // Fanavaozana ny famantaranandro sy ny countdown isaky ny 1s
            document.getElementById('real-clock').innerText = now.toTimeString().split(' ')[0];

            let rem = cycleInfo.secondsRemaining;
            let m = Math.floor(rem / 60).toString().padStart(2, '0');
            let s = (rem % 60).toString().padStart(2, '0');
            document.getElementById('timer-text').innerText = `${m}:${s}`;

            const timerBadge = document.getElementById('timer-badge');
            const timerDot = document.getElementById('timer-dot');
            if (rem <= 15) {
                timerBadge.className = "flex items-center space-x-1.5 bg-red-500/15 border border-red-500/50 px-3 py-1 rounded-lg text-red-400 font-mono font-bold text-sm shadow-inner";
                timerDot.className = "w-2 h-2 rounded-full bg-red-400 animate-ping";
            } else {
                timerBadge.className = "flex items-center space-x-1.5 bg-emerald-500/15 border border-emerald-500/50 px-3 py-1 rounded-lg text-emerald-400 font-mono font-bold text-sm shadow-inner";
                timerDot.className = "w-2 h-2 rounded-full bg-emerald-400 animate-pulse";
            }

            // Raha tsy niova ny cycleIndex ary tsy nisy fanerena (click), dia tsy averina sary ny lisitra
            if (!force && cycleInfo.cycleIndex === lastRenderedCycle) {
                return;
            }
            lastRenderedCycle = cycleInfo.cycleIndex;

            // Fanavaozana ny tsipika ora (13:21, 13:23, 13:25...)
            renderTimeSlots(cycleInfo.nextStartMs);

            const engState = getLiveLeagueState(0, cycleInfo.cycleIndex);
            const canState = getLiveLeagueState(1, cycleInfo.cycleIndex);
            const activeLeague = activeLeagueIndex === 0 ? engState : canState;

            document.getElementById('sub-league-0').innerText = `J${engState.currentJournee}/38`;
            document.getElementById('sub-league-1').innerText = `J${canState.currentJournee}/46`;
            document.getElementById('active-league-name').innerText = activeLeague.name.toUpperCase();
            document.getElementById('journee-badge').innerText = `JOURNÉE ${activeLeague.currentJournee} / ${activeLeague.maxJournees}`;

            // 1. PRONOSTICS & COTES (1 X 2)
            const matchesContainer = document.getElementById('matches-container');
            const currentMatches = activeLeague.schedule[activeLeague.currentJournee - 1] || [];

            matchesContainer.innerHTML = currentMatches.map(m => {
                let totalButs = m.predHome + m.predAway;
                let overUnderText = totalButs > 2 ? `Over 2.5 (${totalButs})` : `Under 2.5 (${totalButs})`;

                return `
                <div class="bg-[#162032] rounded-xl border border-white/10 overflow-hidden shadow-md">
                    <div class="p-3 flex items-center justify-between gap-2">
                        <div class="flex-1 space-y-2 min-w-0">
                            <div class="flex items-center space-x-2">
                                <span class="w-3 h-3 rounded-full flex-shrink-0 shadow-sm border border-white/20" style="background-color: ${m.homeColor}"></span>
                                <span class="text-white font-bold text-sm truncate">${m.home}</span>
                            </div>
                            <div class="flex items-center space-x-2">
                                <span class="w-3 h-3 rounded-full flex-shrink-0 shadow-sm border border-white/20" style="background-color: ${m.awayColor}"></span>
                                <span class="text-white font-bold text-sm truncate">${m.away}</span>
                            </div>
                        </div>

                        <div class="w-[168px] grid grid-cols-3 gap-1.5 flex-shrink-0">
                            <div class="bg-[#52B755] text-white font-extrabold text-xs py-3 rounded-md text-center shadow-sm">
                                ${m.cote1}
                            </div>
                            <div class="bg-[#52B755] text-white font-extrabold text-xs py-3 rounded-md text-center shadow-sm">
                                ${m.coteX}
                            </div>
                            <div class="bg-[#52B755] text-white font-extrabold text-xs py-3 rounded-md text-center shadow-sm">
                                ${m.cote2}
                            </div>
                        </div>
                    </div>

                    <div class="bg-[#0F172A]/80 px-3 py-2 border-t border-white/5 flex justify-between items-center text-xs">
                        <div class="flex items-center space-x-1.5">
                            <span class="text-slate-400">Score Exact:</span>
                            <span class="bg-blue-500/20 border border-blue-500/40 text-blue-300 font-extrabold px-2 py-0.5 rounded">${m.predHome} - ${m.predAway}</span>
                        </div>
                        <div class="flex items-center space-x-1.5">
                            <span class="text-slate-400">Total Buts:</span>
                            <span class="bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 font-extrabold px-2 py-0.5 rounded">${overUnderText}</span>
                        </div>
                    </div>
                </div>
                `;
            }).join('');

            // 2. RÉSULTATS (Valin'ny Journée teo aloha)
            const rDiv = document.getElementById('view-resultats');
            let prevJ = activeLeague.currentJournee - 1;
            let prevMatches = [];
            let labelJ = prevJ;

            if (prevJ >= 1) {
                prevMatches = activeLeague.schedule[prevJ - 1];
            } else {
                // Raha eo amin'ny J1 isika izao, dia ny J farany tamin'ny saison teo aloha no aseho
                const prevSeason = buildSeasonData(activeLeagueIndex, Math.floor(cycleInfo.cycleIndex / activeLeague.maxJournees) - 1);
                labelJ = activeLeague.maxJournees;
                prevMatches = prevSeason.schedule[labelJ - 1];
            }

            let prevTimeStr = formatHHMM(cycleInfo.nextStartMs - CYCLE_DURATION_MS);
            rDiv.innerHTML = `
                <div class="bg-amber-500/10 border border-amber-500/30 text-amber-400 text-center font-extrabold text-xs py-2 rounded-lg mb-2">
                    VALIN-DALAO - JOURNÉE ${labelJ} (Lalao tamin'ny ${prevTimeStr})
                </div>` + prevMatches.map(m => {
                let isExact = (m.predHome === m.actualHome && m.predAway === m.actualAway);
                return `
                <div class="bg-[#162032] p-3 rounded-xl border border-white/10 shadow-sm">
                    <div class="flex justify-between items-center">
                        <div class="flex-1 flex items-center space-x-2 min-w-0">
                            <span class="w-2.5 h-2.5 rounded-full flex-shrink-0" style="background-color: ${m.homeColor}"></span>
                            <span class="font-bold text-sm text-white truncate">${m.home}</span>
                        </div>
                        <div class="px-3 py-1 bg-emerald-500/20 border border-emerald-500 text-emerald-400 rounded-lg font-black text-sm mx-2">
                            ${m.actualHome} - ${m.actualAway}
                        </div>
                        <div class="flex-1 flex items-center justify-end space-x-2 min-w-0">
                            <span class="font-bold text-sm text-white truncate">${m.away}</span>
                            <span class="w-2.5 h-2.5 rounded-full flex-shrink-0" style="background-color: ${m.awayColor}"></span>
                        </div>
                    </div>
                    <div class="mt-2 pt-2 border-t border-white/5 flex justify-between items-center text-[11px]">
                        <span class="text-slate-400">Vinavina: <b class="text-slate-200">${m.predHome} - ${m.predAway}</b> ${isExact ? '✅' : ''}</span>
                        <span class="text-slate-400">Cotes: <b class="text-slate-300">${m.cote1} | ${m.coteX} | ${m.cote2}</b></span>
                        <span class="text-amber-400 font-bold">Total: ${m.actualHome + m.actualAway} buts</span>
                    </div>
                </div>
                `;
            }).join('');

            // 3. CLASSEMENT
            const cDiv = document.getElementById('view-classement');
            let sortedTeams = [...activeLeague.teams].sort((a, b) => {
                let ptsA = (a.won * 3) + a.drawn;
                let ptsB = (b.won * 3) + b.drawn;
                if (ptsB !== ptsA) return ptsB - ptsA;
                let diffA = a.gf - a.ga;
                let diffB = b.gf - b.ga;
                if (diffB !== diffA) return diffB - diffA;
                return b.gf - a.gf;
            });

            cDiv.innerHTML = `
                <div class="bg-[#162032] rounded-xl border border-white/10 overflow-hidden shadow-md">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs">
                            <thead class="bg-black/40 text-slate-400 uppercase text-[11px] border-b border-white/10">
                                <tr>
                                    <th class="py-2.5 px-2.5 text-center w-8">#</th>
                                    <th class="py-2.5 px-2">Ekipa</th>
                                    <th class="py-2.5 px-2 text-center">MJ</th>
                                    <th class="py-2.5 px-2 text-center">G</th>
                                    <th class="py-2.5 px-2 text-center">N</th>
                                    <th class="py-2.5 px-2 text-center">P</th>
                                    <th class="py-2.5 px-2 text-center">DB</th>
                                    <th class="py-2.5 px-3 text-center text-emerald-400 font-black">PTS</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-white/5">
                                ${sortedTeams.map((t, idx) => {
                                    let pts = (t.won * 3) + t.drawn;
                                    let diff = t.gf - t.ga;
                                    let rankClass = idx < 4 ? 'text-emerald-400 font-black' : (idx >= sortedTeams.length - 3 ? 'text-red-400 font-bold' : 'text-slate-400 font-bold');
                                    return `
                                    <tr class="hover:bg-white/5 transition">
                                        <td class="py-2.5 px-2.5 text-center ${rankClass}">${idx + 1}</td>
                                        <td class="py-2.5 px-2 font-bold text-white flex items-center space-x-2">
                                            <span class="w-2.5 h-2.5 rounded-full flex-shrink-0" style="background-color: ${t.color}"></span>
                                            <span class="truncate">${t.name}</span>
                                        </td>
                                        <td class="py-2.5 px-2 text-center text-slate-300">${t.played}</td>
                                        <td class="py-2.5 px-2 text-center text-slate-400">${t.won}</td>
                                        <td class="py-2.5 px-2 text-center text-slate-400">${t.drawn}</td>
                                        <td class="py-2.5 px-2 text-center text-slate-400">${t.lost}</td>
                                        <td class="py-2.5 px-2 text-center text-slate-300 font-mono">${diff > 0 ? '+' + diff : diff}</td>
                                        <td class="py-2.5 px-3 text-center font-black text-emerald-400 text-sm">${pts}</td>
                                    </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // Mandeha isaky ny 1 segondra mba hifanaraka tsara amin'ny ora tena izy
        setInterval(() => renderAll(false), 1000);
        renderAll(true);
    </script>
</body>
</html>
